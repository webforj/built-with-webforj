# webforJ configuration
webforj.entry = com.webforj.builtwithwebforj.ghostai.Application
webforj.quiet=on
webforj.legacyHtmlInText=false
webforj.version=@webforj.version@

# Spring configuration
server.shutdown=graceful
spring.application.name=ghost:ai

# Gemini via Spring AI. Set the key in the environment, never in this file:
#   export SPRING_AI_GOOGLE_GENAI_API_KEY=...
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

# MCP client, the webforJ knowledge base the assistant calls as a tool
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=webforj-chat
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.streamable-http.connections.webforj.url=https://mcp.webforj.com
spring.ai.mcp.client.streamable-http.connections.webforj.endpoint=/mcp
