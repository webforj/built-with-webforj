# Development overrides. Shared settings come from application.properties.
webforj.debug = true
webforj.devtools.craftforj.enabled=true
webforj.devtools.livereload.enabled=true
webforj.devtools.livereload.static-resources-enabled=true
webforj.devtools.browser.open=true

server.shutdown=immediate

# H2 console, for looking at the database while developing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# webforJ owns the root path, so hand the console path back to Spring
webforj.exclude-urls=/h2-console/**
