# webforJ configuration
webforj.entry = com.webforj.builtwithwebforj.invoicereader.Application
webforj.quiet=on
webforj.legacyHtmlInText=false
webforj.version=@webforj.version@

# Spring configuration
server.shutdown=graceful
spring.application.name=InvoiceReader

# Gemini via Spring AI. Set the key in the environment, never in this file:
#   export SPRING_AI_GOOGLE_GENAI_API_KEY=...
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
