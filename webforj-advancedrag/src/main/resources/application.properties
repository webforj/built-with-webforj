# webforJ configuration
webforj.entry = com.webforj.builtwithwebforj.advancedrag.Application
webforj.quiet=on
webforj.legacyHtmlInText=false
webforj.version=@webforj.version@

# Spring configuration
server.shutdown=graceful
spring.application.name=AdvancedRag

# Gemini via Spring AI. Set the keys in the environment, never in this file:
#   export SPRING_AI_GOOGLE_GENAI_API_KEY=...
#   export SPRING_AI_GOOGLE_GENAI_EMBEDDING_API_KEY=...
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
